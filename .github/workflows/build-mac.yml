name: Build macOS

on:
  push:
    branches: [release/mac]
  pull_request:
    branches: [release/mac]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: ''
        type: string

concurrency:
  group: build-mac
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install setuptools (for node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_python: python

      - name: Add sharp x64 prebuilds (for the Intel slice)
        run: |
          SHARP_VER=$(node -p "require('./node_modules/sharp/package.json').version")
          VIPS_VER=$(node -p "require('./node_modules/@img/sharp-libvips-darwin-arm64/package.json').version")
          npm install --no-save --force --cpu=x64 --os=darwin \
            "@img/sharp-darwin-x64@$SHARP_VER" "@img/sharp-libvips-darwin-x64@$VIPS_VER"

      - name: Run tests
        run: npm test

      - name: Build & Publish macOS (ARM64 + x64, signed + notarized)
        run: npm run publish:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (Developer ID Application cert exported as base64 .p12)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentCloud-Hardware-Bridge-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
